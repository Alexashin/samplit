name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSAMPLIT_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Python tests
        run: |
          python -m pip install pytest -r tools/license_server/requirements.txt
          python -m pytest tests/test_mark_kit.py tools/license_server/tests -q

      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $vst3 = Get-ChildItem build -Recurse -Filter Samplit.vst3 -Directory | Select-Object -First 1
          .\pluginval\pluginval.exe --strictness-level 5 --skip-gui-tests $vst3.FullName
